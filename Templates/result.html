<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Prediction Result</title>
    <style>
        /* Body and background */
        body {
            font-family: 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
        }

        /* Container with glass effect */
        .container {
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 1px 2px 10px rgba(0, 0, 0, 0.4);
        }

        /* Prediction text with color coding */
        .prediction {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            text-shadow: 1px 2px 5px rgba(0,0,0,0.3);
        }

        .safe {
            background-color: #4caf50; /* green */
        }

        .unsafe {
            background-color: #e74c3c; /* red */
        }

        /* AI explanation */
        .explanation {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            color: #fff;
            font-style: italic;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            line-height: 1.5;
        }

        /* Back button */
        a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #6cb2eb;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        a:hover {
            background-color: #4c8dd8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Water Quality Prediction</h1>

        <!-- Prediction box -->
        <div class="prediction {% if prediction == 'Safe' %}safe{% else %}unsafe{% endif %}">
            {{ prediction }}
        </div>

        <!-- OpenAI explanation -->
        <div class="explanation">
            {{ explanation }}
        </div>

        <!-- Back button -->
        <a href="{{ url_for('index') }}">Predict Again</a>
    </div>
</body>

</html>
